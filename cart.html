<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Bag | Leather Factory Shop</title>
  <meta name="description" content="Your Leather Factory Shop bag." />
  <link rel="icon" href="assets/logo-tan.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/lfs.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body data-page="cart">
  <main>
    <section class="phero">
      <div class="wrap">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><b>Your bag</b></nav>
        <h1 class="h-xl" data-split data-now>Your <em>bag.</em></h1>
      </div>
    </section>
    <section class="wrap cartpg" id="cartPage">
      <div id="cartLines"></div>
      <aside class="summary" id="summary">
        <h3>Order summary</h3>
        <div class="line"><span>Subtotal</span><b id="sSub">$0</b></div>
        <div class="line"><span>Shipping</span><b>Calculated at checkout</b></div>
        <div class="total"><span>Total</span><b id="sTotal">$0</b></div>
        <button class="btn btn--full" id="checkout"><span>Proceed to checkout</span><svg><use href="#i-arrow"/></svg></button>
        <small>Secure checkout · SSL encrypted</small>
      </aside>
    </section>
    <section class="block wrap">
      <h2 class="h-md block__title" data-split>Complete the <em>look</em></h2>
      <div class="pgrid" id="recs"></div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="js/lfs-data.js"></script>
  <script src="js/lfs-core.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
