<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leather Jackets | Leather Factory Shop</title>
  <meta name="description" content="Premium handmade leather jackets by Leather Factory Shop." />
  <link rel="icon" href="assets/logo-tan.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/lfs.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body data-page="category">
  <main>
    <section class="phero">
      <div class="wrap">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><a href="shop.html">Shop</a><span id="crumbGroup"></span><b id="crumbCat">Biker</b></nav>
        <h1 class="h-xl" id="catTitle">Biker <em>jackets.</em></h1>
        <div class="phero__row">
          <p class="lead" id="catLine" data-reveal data-now data-delay=".3"></p>
          <div class="toolbar" data-reveal data-now data-delay=".4">
            <div class="chips" role="group" aria-label="Filter by price">
              <button class="chip is-active" data-f="all">All</button>
              <button class="chip" data-f="lo">Under $150</button>
              <button class="chip" data-f="mid">$150 – $250</button>
              <button class="chip" data-f="hi">$250+</button>
            </div>
            <select class="select" id="sort" aria-label="Sort products">
              <option value="default">Default sorting</option>
              <option value="popularity">Sort by popularity</option>
              <option value="rating">Sort by average rating</option>
              <option value="latest">Sort by latest</option>
              <option value="price-asc">Sort by price: low to high</option>
              <option value="price-desc">Sort by price: high to low</option>
            </select>
            <div class="view-toggle" role="group" aria-label="View">
              <button class="is-on" data-view="rack"><svg viewBox="0 0 24 24"><path d="M3 5h18M7 5v3M12 5v3M17 5v3M5 8h4v11H5zM10 8h4v11h-4zM15 8h4v11h-4z"/></svg>Rack</button>
              <button data-view="grid"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>Grid</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="rack" id="rack" aria-label="Products on the rack">
      <div class="rack__pin">
        <div class="rack__track" id="track"><div class="rack__rail" aria-hidden="true"><i class="bracket bracket--l"></i><i class="bracket bracket--r"></i></div></div>
        <div class="rack__floor" aria-hidden="true"></div>
        <div class="rack__hud">
          <span><b id="rackNum">0</b> jackets on this rack</span>
          <span class="rack__hint"><i></i> Scroll to slide · click a jacket to open it</span>
          <span class="rack__bar"><span id="rackBar"></span></span>
        </div>
      </div>
    </section>

    <section class="wrap" id="gridWrap" hidden><div class="pgrid" id="pgrid"></div></section>

    <section class="block wrap">
      <h2 class="h-md block__title" data-split>Other <em>racks</em></h2>
      <div class="minis" id="moreRacks"></div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="js/lfs-data.js"></script>
  <script src="js/lfs-core.js"></script>
  <script src="js/category.js"></script>
</body>
</html>
