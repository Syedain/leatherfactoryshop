<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop Leather Jackets | Leather Factory Shop</title>
  <meta name="description" content="Walk the Leather Factory Shop store: men's biker, bomber, hooded and vests, women's biker and bomber jackets, new arrivals and last call." />
  <link rel="icon" href="assets/logo-tan.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/lfs.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body data-page="shop" data-nav="shop">
  <main>
    <section class="phero">
      <div class="wrap">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><b>Shop</b></nav>
        <h1 class="h-xl" data-split data-now>Walk the <em>store.</em></h1>
        <div class="phero__row">
          <p class="lead" data-reveal data-now data-delay=".4">Every rack is a style. Scroll to walk the floor, brush past the jackets, and step up to any rack to see everything on it.</p>
          <label class="search-inline" data-reveal data-now data-delay=".5">
            <svg><use href="#i-search"/></svg>
            <input id="floorSearch" type="search" placeholder="Search, e.g. bomber, shearling…" autocomplete="off" />
            <span class="search-inline__hint" id="floorHint"></span>
          </label>
        </div>
      </div>
    </section>

    <section class="floor" id="floor" aria-label="Categories">
      <div class="floor__pin">
        <div class="floor__wall" aria-hidden="true"><div class="floor__wall-inner" id="wall"></div></div>
        <div class="floor__ground" aria-hidden="true"><div class="floor__planks" id="planks"></div></div>
        <div class="floor__track" id="floorTrack"></div>
        <div class="rack__hud">
          <span><b id="floorNum">8</b> racks · <b id="floorJackets">24</b> jackets</span>
          <span class="rack__hint"><i></i> Scroll to walk the store</span>
          <span class="rack__bar"><span id="floorBar"></span></span>
        </div>
      </div>
    </section>

    <section class="block wrap">
      <h2 class="h-md block__title" data-split>Shop by <em>category</em></h2>
      <div class="minis" id="catList"></div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="js/lfs-data.js"></script>
  <script src="js/lfs-core.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
